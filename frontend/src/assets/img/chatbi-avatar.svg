<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="avatar-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="20" cy="20" r="20" fill="url(#avatar-gradient)"/>
  
  <!-- 内圈装饰 -->
  <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- AI 机器人头像 -->
  <rect x="11" y="12" width="18" height="14" rx="4" fill="white"/>
  
  <!-- 眼睛 -->
  <circle cx="15" cy="18" r="2" fill="url(#avatar-accent)"/>
  <circle cx="25" cy="18" r="2" fill="url(#avatar-accent)"/>
  
  <!-- 嘴巴/数据条 -->
  <rect x="14" y="22" width="3" height="2" rx="0.5" fill="url(#avatar-gradient)"/>
  <rect x="18.5" y="22" width="3" height="2" rx="0.5" fill="url(#avatar-accent)"/>
  <rect x="23" y="22" width="3" height="2" rx="0.5" fill="url(#avatar-gradient)"/>
  
  <!-- 天线 -->
  <circle cx="20" cy="9" r="2" fill="white"/>
  <rect x="19" y="9" width="2" height="4" fill="white"/>
</svg>
