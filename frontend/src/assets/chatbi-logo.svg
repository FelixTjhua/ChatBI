<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="fill: none;">
  <defs>
    <linearGradient id="chatida-gradient-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="chatida-gradient-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="chatida-gradient-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
    <filter id="chatida-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外圈光晕 -->
  <circle cx="20" cy="20" r="18" style="fill:url(#chatida-gradient-glow);opacity:0.3"/>
  
  <!-- 主圆形背景 -->
  <circle cx="20" cy="20" r="16" style="fill:url(#chatida-gradient-main)" filter="url(#chatida-glow)"/>
  
  <!-- 内部装饰圆环 -->
  <circle cx="20" cy="20" r="14" style="fill:none;stroke:rgba(255,255,255,0.2);stroke-width:0.5"/>
  
  <!-- 聊天气泡形状 -->
  <path d="M12 14C12 12.3431 13.3431 11 15 11H25C26.6569 11 28 12.3431 28 14V22C28 23.6569 26.6569 25 25 25H18L14 28V25H15C13.3431 25 12 23.6569 12 22V14Z" style="fill:rgba(255,255,255,0.95)"/>
  
  <!-- 数据分析图表 - 柱状图 -->
  <rect x="14" y="19" width="2.5" height="4" rx="0.5" style="fill:url(#chatida-gradient-accent)"/>
  <rect x="17.5" y="16" width="2.5" height="7" rx="0.5" style="fill:url(#chatida-gradient-main)"/>
  <rect x="21" y="17.5" width="2.5" height="5.5" rx="0.5" style="fill:url(#chatida-gradient-accent)"/>
  <rect x="24.5" y="14" width="2.5" height="9" rx="0.5" style="fill:url(#chatida-gradient-main)"/>
  
  <!-- AI 神经网络点 -->
  <circle cx="15.25" cy="14" r="1" style="fill:url(#chatida-gradient-accent)"/>
  <circle cx="20" cy="13" r="1" style="fill:url(#chatida-gradient-main)"/>
  <circle cx="24.75" cy="14" r="1" style="fill:url(#chatida-gradient-accent)"/>
  
  <!-- 连接线 -->
  <path d="M15.25 14L20 13L24.75 14" style="stroke:url(#chatida-gradient-accent);stroke-width:0.5;fill:none;opacity:0.6"/>
</svg>
