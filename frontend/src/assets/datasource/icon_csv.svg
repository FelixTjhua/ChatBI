<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CSV 图标 - 蓝色调区分于Excel绿色 -->
  <defs>
    <linearGradient id="csvBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="csvSheet" x1="18" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="csvShadow" x="-2" y="-1" width="52" height="52">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- 白色文档底层 -->
  <rect x="16" y="6" width="28" height="36" rx="2.5" fill="url(#csvSheet)" filter="url(#csvShadow)"/>
  <!-- 逗号分隔数据行 -->
  <line x1="22" y1="14" x2="38" y2="14" stroke="#1D4ED8" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="22" y1="20" x2="38" y2="20" stroke="#1D4ED8" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="22" y1="26" x2="38" y2="26" stroke="#1D4ED8" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="22" y1="32" x2="38" y2="32" stroke="#1D4ED8" stroke-width="0.6" stroke-opacity="0.4"/>
  <circle cx="27" cy="17" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <circle cx="33" cy="17" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <circle cx="27" cy="23" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <circle cx="33" cy="23" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <circle cx="27" cy="29" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <circle cx="33" cy="29" r="0.8" fill="#1D4ED8" fill-opacity="0.5"/>
  <!-- 蓝色左侧面板 -->
  <rect x="4" y="10" width="20" height="28" rx="2.5" fill="url(#csvBg)" filter="url(#csvShadow)"/>
  <!-- CSV 文字 -->
  <text x="14" y="28" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">CSV</text>
</svg>
